name = "africhome-licence-manager"
main = "src/index.js"
compatibility_date = "2026-11-19"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "africhome-licences"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
