name: Shell validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Test Hysteria input validation
        run: bash tests/hysteria-validation.sh
      - name: Test read-only port routing inventory
        run: bash tests/port-routing-validation.sh
      - name: Test protocol account config permissions
        run: bash tests/protocol-users-validation.sh
      - name: Install isolated routing test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck haproxy openssl iproute2
      - name: Test HAProxy ordinary TLS SNI passthrough
        run: bash tests/haproxy-sni-validation.sh
      - name: Run ShellCheck errors
        run: |
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
