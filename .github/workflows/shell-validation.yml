name: Shell validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)
      - name: Run ShellCheck errors
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error

      - name: Smoke-test terminal menu startup and exit
        shell: bash
        run: |
          set -euo pipefail
          printf '0\n' | TERM=xterm timeout 15s bash menu.sh

      - name: Check DNSTT installer safety
        shell: bash
        run: bash tests/dnstt-safety-check.sh
